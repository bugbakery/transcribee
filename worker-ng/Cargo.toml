[package]
name = "worker-ng"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
burn-tensor = { version = "0.22.0", default-features = false, features = [
    "std",
    "cpu",
    "flex",
    "wgpu",
    "metal",
    "simd",
    "rayon",
    "apple-amx",
    "fusion",
] }
clap = "4.6.7"
earshot = "1.2.2"
env_logger = "0.11.11"
ez-ffmpeg = { version = "0.19.0" }
futures = "0.3.34"
half = "2.7.1"
indicatif = "0.18.6"
json = "0.12.4"
lazy_static = "1.5.1"
log = "0.4.34"
mlx-rs = "0.32.0"
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "webgpu",
    "api-28",
    "half",
    "load-dynamic",
] }
reqwest = { version = "0.13.5", features = ["stream"] }
stft-rs = "0.6.0"
tokenizers = "0.23.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
