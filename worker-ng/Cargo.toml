[package]
name = "worker-ng"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
burn-tensor = { version = "0.22.0", default-features = false, optional = true, features = [
    "std",
    "flex",
    "wgpu",
    "simd",
    "rayon",
    "fusion",
    "autotune",
] }
clap = "4.6.7"
compile-time-run = "0.2.12"
earshot = "1.2.2"
ez-ffmpeg = { version = "0.19.3" }
futures = "0.3.34"
half = { version = "2.7.1", optional = true }
indicatif = "0.18.6"
json = "0.12.4"
mlx-rs = { version = "0.33.0", optional = true, features = ["metal-jit"]}
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.15", default-features = false, optional = true, features = [
    "std",
    "ndarray",
    "webgpu",
    "api-27",
    "openvino",
    "half",
    "load-dynamic",
    "tracing",
] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
stft-rs = "0.6.0"
sysinfo = "0.40.1"
tokenizers = "0.23.2"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-perfetto = { version = "0.1.5", optional = true }
venator = { version = "1.1.0", optional = true }
serde = "1.0.229"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.2", features = ["serde", "v7"] }
serde_json = "1.0.154"
automerge = "0.12.0"
tokio-tungstenite = "0.30.0"
sentencex = "0.1.35"

[target.'cfg( target_os = "macos" )'.dependencies]
burn-tensor = { version = "0.22.0", default-features = false, optional = true, features = [
    "metal",
    "apple-amx",
] }

[target.'cfg( target_os = "linux" )'.dependencies]
ffmpeg-sys-next = { version = "*", features = ["build", "static"] }

[profile.dev.package."*"]
# Set the default for dependencies in Development mode.
opt-level = 3

[profile.release]
debug = true

[dev-dependencies]
rand = "0.10.4"
npyz = "0.9.1"


[features]
default = ["backend-onnxruntime"]
backend-onnxruntime = ["ort", "half"]
backend-burn = ["burn-tensor"]
backend-mlx = ["mlx-rs"]
slow-tests = []
debug-logging = ["tracing-perfetto", "venator"]
