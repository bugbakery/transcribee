[package]
name = "worker-ng"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = "4.6.7"
earshot = "1.2.2"
env_logger = "0.11.11"
ez-ffmpeg = { version = "0.19.0" }
futures = "0.3.34"
half = "2.7.1"
indicatif = "0.18.6"
lazy_static = "1.5.1"
log = "0.4.34"
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "webgpu", "download-binaries", "api-28", "tls-rustls", "half"] }
reqwest = { version = "0.13.5", features = ["stream"] }
stft-rs = "0.6.0"
tokenizers = "0.23.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] } 
