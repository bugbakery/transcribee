[package]
name = "worker-ng"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = "4.6.7"
compute = "0.2.3"
earshot = "1.2.2"
ez-ffmpeg = { version = "0.19.0" }
futures = "0.3.34"
indicatif = "0.18.6"
log = "0.4.34"
mel_spec = "0.4.0"
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.13", features = ["ndarray", "webgpu"] }
reqwest = { version = "0.13.5", features = ["stream"] }
tokenizers = "0.23.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] } 
