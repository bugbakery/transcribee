[package]
name = "worker-ng"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
burn-tensor = { version = "0.22.0", default-features = false, optional = true, features = [
    "std",
    "flex",
    "wgpu",
    "simd",
    "rayon",
    "fusion",
    "autotune",
    "tracing",
] }
clap = "4.6.7"
earshot = "1.2.2"
env_logger = "0.11.11"
ez-ffmpeg = { version = "0.19.3" }
futures = "0.3.34"
half = "2.7.1"
indicatif = "0.18.6"
json = "0.12.4"
lazy_static = "1.5.1"
log = "0.4.34"
mlx-rs = { version = "0.32.0", default-features = false, optional = true }
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.15", default-features = false, features = [
    "std",
    "ndarray",
    "webgpu",
    "api-28",
    "half",
    "load-dynamic",
] }
reqwest = { version = "0.13.5", features = ["stream"] }
stft-rs = "0.6.0"
tokenizers = "0.23.2"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
npyz = "0.9.1"

[features]
# this is not depending on onnxruntime because we need onnxruntime anyways for vad
backend-onnxruntime = []
backend-burn = ["burn-tensor"]
backend-mlx = ["mlx-rs"]
slow-tests = []
