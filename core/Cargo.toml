[package]
name = "transcribee_core"
version = "0.1.0"
edition = "2024"

[dependencies]
automerge = { version = "0.9.0" }
env_logger = "0.11.12"
js-sys = "0.3.107"
uniffi = { version = "0.31.1", features = ["wasm-unstable-single-threaded"] }
wasm-bindgen = "0.2.130"

[lib]
crate-type = ["staticlib", "rlib", "cdylib"]

[dependencies.getrandom]
version = "*"
features = ["wasm_js"]

# [[bin]]
# # This can be whatever name makes sense for your project, but the rest of this tutorial assumes uniffi-bindgen.
# name = "uniffi-bindgen"
# path = "uniffi-bindgen.rs"
