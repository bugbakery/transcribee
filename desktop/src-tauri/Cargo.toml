[package]
name = "transcribee-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "transcribee_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.103"
axum = { version = "0.8.9", features = ["http1", "ws", "tokio"] }
colored = "3.1.1"
worker-adapter = { path = "../worker-adapter/" }
getrandom = "0.4.3"
http = "1.4.2"
http-range = "0.1.5"
infer = "0.22.0"
log = "0.4.29"
percent-encoding = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tokio = "1.52.3"
tokio-tungstenite = "0.29.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v7"] }
rand = { version = "0.10.2", features = ["thread_rng"] }
tauri-plugin-store = "2"
tauri-plugin-os = "2"
kill_tree = "0.2.4"
humantime = "2.4.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Console", "Win32_Foundation"] }
